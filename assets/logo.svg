<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E243A"/>
      <stop offset="100%" stop-color="#071322"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Container background with crisp border -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#bgGrad)" stroke="#1E3E5C" stroke-width="1.5"/>
  
  <!-- Subtle reticle grid / crosshairs -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#16324A" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#16324A" stroke-width="1" stroke-dasharray="2 3"/>
  
  <!-- Central Trachea / Bronchial trunk -->
  <path d="M32 12V25" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Left Lung Anatomy (viewed from front, anatomical right) -->
  <path d="M30 25C26 21 19 21.5 16 26.5C13 31.5 13 41 16.5 47C19.5 52 25.5 51 29 46C30.5 43.8 30.5 35 30 25Z" 
        fill="#0E2B45" fill-opacity="0.6" stroke="url(#cyanGrad)" stroke-width="2.2" stroke-linejoin="round"/>
  
  <!-- Right Lung Anatomy (anatomical left) -->
  <path d="M34 25C38 21 45 21.5 48 26.5C51 31.5 51 41 47.5 47C44.5 52 38.5 51 35 46C33.5 43.8 33.5 35 34 25Z" 
        fill="#0E2B45" fill-opacity="0.6" stroke="url(#cyanGrad)" stroke-width="2.2" stroke-linejoin="round"/>
  
  <!-- Internal Neural / Bronchial Branches -->
  <path d="M29 28L21 34M28 35L19 41M29 42L23 45" stroke="url(#blueGrad)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M35 28L43 34M36 35L45 41M35 42L41 45" stroke="url(#blueGrad)" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Neural Nodes (AI explainability markers) -->
  <circle cx="32" cy="12" r="2.2" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="21" cy="34" r="1.8" fill="#38BDF8"/>
  <circle cx="43" cy="34" r="1.8" fill="#38BDF8"/>
  <circle cx="19" cy="41" r="1.8" fill="#60A5FA"/>
  <circle cx="45" cy="41" r="1.8" fill="#60A5FA"/>
  <circle cx="23" cy="45" r="1.6" fill="#38BDF8"/>
  <circle cx="41" cy="45" r="1.6" fill="#38BDF8"/>
  <circle cx="32" cy="25" r="2" fill="#38BDF8" filter="url(#glow)"/>
</svg>
